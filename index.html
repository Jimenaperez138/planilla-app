<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Planilla - Guatemala</title>

    <!-- Librería para la generación y descarga de reportes en PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #28a745;
            --danger-color: #dc3545;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            color: #1a252f;
            margin: 0;
            font-size: 1.8rem;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease-in-out;
        }

        .btn-pdf {
            background-color: var(--danger-color);
            color: white;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-pdf:hover {
            background-color: #bd2130;
        }

        .btn-success {
            background-color: var(--secondary-color);
            color: white;
        }

        .btn-success:hover {
            background-color: #218838;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #495057;
        }

        .form-group input, .form-group select {
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #dee2e6;
        }

        th {
            background-color: #e9ecef;
            color: #495057;
            font-weight: bold;
        }

        .btn-delete {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            background-color: #d4edda;
            color: #155724;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container" id="area-planilla">
    <div class="header">
        <div>
            <h1>Sistema de Planilla - Guatemala</h1>
            <span class="status-badge">✔ Sincronizado con Google Sheets</span>
        </div>
        
        <!-- BOTÓN DE DESCARGA PDF -->
        <button type="button" class="btn btn-pdf" id="btn-exportar-pdf" onclick="descargarPDF()">
            📄 Descargar Planilla en PDF
        </button>
    </div>

    <!-- Formulario de Registro -->
    <form id="formulario-empleado" onsubmit="guardarEmpleado(event)">
        <h3>Registrar Nuevo Empleado</h3>
        <div class="form-grid">
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" id="nombre" required placeholder="Ej: Juan Pérez">
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" id="telefono" placeholder="Ej: 55551234">
            </div>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="correo" placeholder="ejemplo@correo.com">
            </div>
            <div class="form-group">
                <label>DPI</label>
                <input type="text" id="dpi" required placeholder="CUI / DPI">
            </div>
            <div class="form-group">
                <label>NIT</label>
                <input type="text" id="nit" placeholder="NIT">
            </div>
            <div class="form-group">
                <label>Puesto</label>
                <input type="text" id="puesto" required placeholder="Ej: Contador">
            </div>
            <div class="form-group">
                <label>Salario Base (Q)</label>
                <input type="number" id="salario" step="0.01" required placeholder="3075.10">
            </div>
            <div class="form-group">
                <label>Forma de Pago</label>
                <select id="formaPago">
                    <option value="Transferencia">Transferencia</option>
                    <option value="Depósito">Depósito</option>
                    <option value="Cheque">Cheque</option>
                    <option value="Efectivo">Efectivo</option>
                </select>
            </div>
            <div class="form-group">
                <label>Banco</label>
                <input type="text" id="banco" placeholder="Ej: BI, Banrural">
            </div>
            <div class="form-group">
                <label>Número de Cuenta</label>
                <input type="text" id="cuenta" placeholder="No. de Cuenta">
            </div>
        </div>
        <button type="submit" class="btn btn-success" id="btn-agregar">+ Agregar Empleado</button>
    </form>

    <!-- Tabla de Empleados -->
    <h3>Lista General de Empleados</h3>
    <div class="table-container">
        <table id="tabla-empleados">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th>DPI</th>
                    <th>NIT</th>
                    <th>Puesto</th>
                    <th>Salario</th>
                    <th>Forma Pago</th>
                    <th>Banco</th>
                    <th>Cuenta</th>
                    <th class="columna-accion">Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla">
                <!-- Se cargan dinámicamente -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // ⚠️ REEMPLAZA ESTA VARIABLE CON LA URL DE TU APPS SCRIPT:
    const URL_API = "PEGA_AQUI_TU_URL_DE_APPS_SCRIPT";

    document.addEventListener("DOMContentLoaded", function() {
        cargarEmpleados();
    });

    function cargarEmpleados() {
        if (!URL_API || URL_API.includes("PEGA_AQUI")) return;

        fetch(URL_API)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById("cuerpo-tabla");
                tbody.innerHTML = "";
                
                data.forEach(emp => {
                    const fechaFormateada = emp.fechaRegistro ? new Date(emp.fechaRegistro).toLocaleDateString() : '-';
                    const fila = document.createElement("tr");
                    fila.innerHTML = `
                        <td>${fechaFormateada}</td>
                        <td>${emp.id || '-'}</td>
                        <td>${emp.nombre || ''}</td>
                        <td>${emp.telefono || ''}</td>
                        <td>${emp.correo || ''}</td>
                        <td>${emp.dpi || ''}</td>
                        <td>${emp.nit || ''}</td>
                        <td>${emp.puesto || ''}</td>
                        <td>Q${parseFloat(emp.salario || 0).toFixed(2)}</td>
                        <td>${emp.formaPago || ''}</td>
                        <td>${emp.banco || ''}</td>
                        <td>${emp.cuenta || ''}</td>
                        <td class="columna-accion">
                            <button class="btn-delete" onclick="eliminarEmpleado(${emp.id})">Eliminar</button>
                        </td>
                    `;
                    tbody.appendChild(fila);
                });
            })
            .catch(err => console.error("Error al cargar datos:", err));
    }

    function guardarEmpleado(e) {
        e.preventDefault();

        const empleado = {
            nombre: document.getElementById("nombre").value,
            telefono: document.getElementById("telefono").value,
            correo: document.getElementById("correo").value,
            dpi: document.getElementById("dpi").value,
            nit: document.getElementById("nit").value,
            puesto: document.getElementById("puesto").value,
            salario: document.getElementById("salario").value,
            formaPago: document.getElementById("formaPago").value,
            banco: document.getElementById("banco").value,
            cuenta: document.getElementById("cuenta").value
        };

        fetch(URL_API, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(empleado)
        })
        .then(() => {
            alert("Empleado guardado correctamente.");
            document.getElementById("formulario-empleado").reset();
            setTimeout(cargarEmpleados, 1500);
        })
        .catch(err => console.error("Error al guardar:", err));
    }

    function eliminarEmpleado(id) {
        if (!confirm("¿Está seguro de eliminar este registro?")) return;

        fetch(URL_API, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "delete", id: id })
        })
        .then(() => {
            alert("Registro eliminado.");
            setTimeout(cargarEmpleados, 1500);
        })
        .catch(err => console.error("Error al eliminar:", err));
    }

    // FUNCIÓN PARA EXPORTAR LA PLANILLA A PDF
    function descargarPDF() {
        const elemento = document.getElementById('area-planilla');
        
        // Elementos que se ocultan en la versión impresa del PDF
        const formulario = document.getElementById('formulario-empleado');
        const botonPdf = document.getElementById('btn-exportar-pdf');
        const acciones = document.querySelectorAll('.columna-accion');

        // Ocultar temporalmente los controles
        formulario.style.display = 'none';
        botonPdf.style.display = 'none';
        acciones.forEach(el => el.style.display = 'none');

        const opciones = {
            margin:       [8, 8, 8, 8],
            filename:     'Reporte_Planilla_Guatemala.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
        };

        // Generar y descargar el documento PDF
        html2pdf().set(opciones).from(elemento).save().then(() => {
            // Mostrar de nuevo los controles en la pantalla
            formulario.style.display = 'block';
            botonPdf.style.display = 'inline-flex';
            acciones.forEach(el => el.style.display = '');
        });
    }
</script>

</body>
</html>
